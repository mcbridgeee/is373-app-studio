{% extends "base.html" %}
{% block title %}log in · {{ brand.name }}{% endblock %}
{% block content %}
<section class="form-stack" aria-labelledby="form-title">
  <p class="eyebrow">welcome back</p>
  <h1 id="form-title">Log in</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required maxlength="32"{% if username %} value="{{ username }}"{% endif %}>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
    <button class="button" type="submit">Log in</button>
  </form>
  <p>new to {{ brand.name }}? <a class="text-link" href="/signup">Create your account</a></p>
</section>
{% endblock %}
